# See https://github.com/Mic92/hestia/blob/7e2b37cec63ebe331ef0e3e6c41e9bc4d2b47487/README.md#build-matrix-eval-once-build-in-parallel

name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  prepare-checks:
    name: Prepare checks
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any-jobs: ${{ steps.matrix.outputs.any-jobs }}
      manifest-version: ${{ steps.matrix.outputs.manifest-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: NixOS/nix-installer-action@v1
        with:
          extra-conf: |
            extra-experimental-features = pipe-operators

      - name: Setup Hestia
        uses: Mic92/hestia@v3

      - name: Evaluate checks and generate job matrix
        id: matrix
        uses: Mic92/hestia/matrix@v3
        with:
          flake: .#ci
          nix-eval-jobs: nix run nixpkgs#nix-eval-jobs --

  check:
    name: ${{ matrix.name }}
    needs: prepare-checks
    if: needs.prepare-checks.outputs.any-jobs == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-checks.outputs.matrix) }}

    steps:
      - name: Install Nix
        uses: NixOS/nix-installer-action@v1

      - name: Setup Hestia
        uses: Mic92/hestia@v3
        with:
          wait-manifest-version: ${{ needs.prepare-checks.outputs.manifest-version }}

      - name: Prefetch derivation closure
        run: |
          hashes=$(printf '%s\n' ${{ matrix.installables }} |
            awk -F/ '{printf "%s%s", (NR > 1 ? "," : ""), substr($NF, 1, 32)}')
          curl -fsS "http://$HESTIA_LISTEN/closure/$hashes" | nix-store --import

      - name: Build derivations
        run: nix build ${{ matrix.installables }} --no-link --keep-going --print-build-logs

      - name: Collect build logs
        if: always()
        run: |
          mkdir logs

          for installable in ${{ matrix.installables }}; do
            drv="${installable%\^\*}"
            drv_name="${drv##*/}"

            log="logs/$drv_name.log"

            if ! nix log "$drv" > "$log" 2> /dev/null; then
              {
                echo "No Nix build log was available."
                echo
                echo "The derivation may not have started, or it may have been substituted after the matrix was generated."
              } > "$log"
            fi
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Logs for '${{ matrix.name }}'
          path: logs
